<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>History - Blood Pressure Monitor</title>

    <!-- Tailwind CSS + DaisyUI 5 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <style>
        /* Custom styles for video and canvas sizing */
        #videoElement {
            height: 150px;
            width: 100%;
            object-fit: cover;
            background-color: #000;
        }

        #waveformCanvas {
            height: 150px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>


    <link rel="manifest" href="static/manifest.json">
    <meta name="theme-color" content="#FF0000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <!-- Navigation -->
    <div class="navbar bg-base-100 shadow-lg z-50">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost text-xl">
                BP Monitor
            </a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
                <li><a href="index.html">Home</a></li>
                <li><a href="measure.html">Measure</a></li>
                <li><a href="history.html">History</a></li>
            </ul>
        </div>
        <div class="navbar-end">
            <!-- Mobile menu -->
            <div class="dropdown dropdown-end lg:hidden">
                <div tabindex="0" role="button" class="btn btn-ghost btn-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </div>
                <ul tabindex="0"
                    class="menu menu-lg dropdown-content mt-3 z-[100] p-2 shadow bg-base-100 rounded-box w-64">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="measure.html">Measure</a></li>
                    <li><a href="history.html">History</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Flash Messages -->




    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-6xl">

        <h1 class="text-4xl font-bold text-center mb-8">Measurement History</h1>

        <div id="historyContent">
            <!-- Content will be loaded by JavaScript -->
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const historyContent = document.getElementById('historyContent');

                if (!window.historyManager) {
                    historyContent.innerHTML = `
            <div class="alert alert-error">
                <span>History manager not available. Please refresh the page.</span>
            </div>
        `;
                    return;
                }

                const measurements = window.historyManager.getAllMeasurements(true); // newest first

                if (measurements.length === 0) {
                    // No measurements
                    historyContent.innerHTML = `
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body items-center text-center">
                    <div class="text-6xl mb-4">📊</div>
                    <h3 class="card-title">No Measurements Yet</h3>
                    <p class="mb-4">You haven't taken any measurements yet.</p>
                    <a href="/measure.html" class="btn btn-primary">Take Your First Measurement</a>
                </div>
            </div>
        `;
                    return;
                }

                // Has measurements - build table
                let tableRows = '';
                measurements.forEach(pred => {
                    const timestamp = new Date(pred.timestamp);
                    const formattedTime = timestamp.toLocaleString();

                    const calibratedBadge = pred.calibrated ?
                        '<span class="badge badge-success badge-sm">Yes</span>' :
                        '<span class="badge badge-ghost badge-sm">No</span>';

                    tableRows += `
            <tr>
                <td class="text-sm">${formattedTime}</td>
                <td><span class="font-semibold">${Math.round(pred.sbp)}</span> <span class="text-xs opacity-70">mmHg</span></td>
                <td><span class="font-semibold">${Math.round(pred.dbp)}</span> <span class="text-xs opacity-70">mmHg</span></td>
                <td><span class="font-semibold">${Math.round(pred.heart_rate)}</span> <span class="text-xs opacity-70">BPM</span></td>
                <td>${calibratedBadge}</td>
                <td>
                    <button class="btn btn-square btn-sm btn-ghost text-error delete-btn" data-timestamp="${pred.timestamp}" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </td>
            </tr>
        `;
                });

                historyContent.innerHTML = `
        <div class="card bg-base-100 shadow-xl mb-6">
            <div class="card-body">
                <div class="flex justify-between items-center mb-4">
                    <p>Showing ${measurements.length} measurement(s)</p>
                    <button id="clearHistoryBtn" class="btn btn-sm btn-outline btn-error">
                        Clear History
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="table table-zebra">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>SBP</th>
                                <th>DBP</th>
                                <th>HR</th>
                                <th>Calibrated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h3 class="card-title">About This History</h3>
                <p>This history is stored in your browser's local storage and will persist across sessions. 
                   The data stays on your device and is never sent to the server.</p>
                <p class="mt-2">For long-term tracking, consider recording your measurements in a health journal or app.</p>
            </div>
        </div>
    `;

                // Add clear history button handler
                document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                    if (confirm('Are you sure you want to clear all measurement history? This cannot be undone.')) {
                        window.historyManager.clearHistory();
                        location.reload();
                    }
                });

                // Add delete button handlers
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const timestamp = e.currentTarget.getAttribute('data-timestamp');
                        if (confirm('Are you sure you want to delete this measurement?')) {
                            window.historyManager.deleteMeasurement(timestamp);
                            // Reload to reflect changes
                            location.reload();
                        }
                    });
                });
            });
        </script>

    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-10 bg-base-200 text-base-content mt-auto">
        <aside>
            <p class="font-semibold">For informational purposes only. Not a substitute for medical advice.</p>
            <p class="text-sm opacity-70">&copy; Chang Sau Sheong</p>
        </aside>
    </footer>

    <!-- Global Scripts -->
    <script src="static/js/calibration.js"></script>
    <script src="static/js/history.js"></script>




</body>

</html>
